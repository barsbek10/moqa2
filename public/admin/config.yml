backend:
  name: git-gateway
  branch: master # Branch to update (optional; defaults to master)

media_folder: "public/images/uploads" # Location where files will be stored in the repo
public_folder: "/images/uploads" # The src attribute for uploaded media

collections:
  - name: "homepage"
    label: "Homepage"
    delete: false
    files:
      - name: "homepage_index"
        label: "Homepage Content"
        file: "src/content/homepage/-index.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                summary: "{{fields.label}} → {{fields.link}}"
                fields:
                  - { label: "Enable", name: "enable", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }

          - label: "Explore Menu"
            name: "explore_menu"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options:
                      - FaMugHot
                      - FaBowlFood
                      - FaGlassWater
                      - FaBurger
                      - FaPizzaSlice
                      - FaCoffee
                      - FaUtensils
                      - FaIceCream
                      - FaLeaf
                      - FaTruck
                      - FaStar
                      - FaHeart
                    default: FaMugHot
                  - label: "Button"
                    name: "button"
                    widget: "object"
                    fields:
                      - { label: "Enable", name: "enable", widget: "boolean", default: true }
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Link", name: "link", widget: "string" }

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description (HTML/Markdown allowed)", name: "description", widget: "markdown" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Button"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Enable", name: "enable", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }

          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "markdown" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }

          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Content", name: "content", widget: "text" }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - label: "Key Benefits"
                name: "key_benefits"
                widget: "list"
                summary: "{{fields.benefit}}"
                fields:
                  - { label: "Benefit", name: "benefit", widget: "string" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options:
                      - FaRegClock
                      - FaTags
                      - FaCartShopping
                      - FaGift
                      - FaBolt
                      - FaShieldHeart
                    default: FaRegClock

          - label: "Blog Section"
            name: "blog_section"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: false }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Button"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Enable", name: "enable", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }

  - name: "about"
    label: "About Page"
    delete: false
    files:
      - name: "about_index"
        label: "About Content"
        file: "src/content/about/-index.md"
        format: "frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Image", name: "image", widget: "image", required: false }

          - label: "Media"
            name: "media"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Link (YouTube embed URL)", name: "link", widget: "string" }

          - label: "Key Benefits"
            name: "key_benefits"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - FaLeaf
                  - FaPizzaSlice
                  - FaMugHot
                  - FaBowlFood
                  - FaTruck
                  - FaHeart
                  - FaStar
                  - FaBolt
                required: false

          - label: "Information"
            name: "information"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "markdown" }
              - { label: "Description", name: "description", widget: "markdown" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Metrics"
                name: "metrics"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - label: "Counter"
                    name: "counter"
                    widget: "object"
                    fields:
                      - { label: "Count", name: "count", widget: "string" }
                      - { label: "Count Suffix", name: "count_suffix", widget: "string", required: false }
                      - { label: "Count Prefix", name: "count_prefix", widget: "string", required: false }
                      - { label: "Count Duration (sec)", name: "count_duration", widget: "number", value_type: "float", min: 0, step: 0.1, default: 1 }

          - { label: "Draft", name: "draft", widget: "boolean", default: false }

  - name: "menu"
    label: "Menu Page"
    delete: false
    files:
      - name: "menu_index"
        label: "Menu Content"
        file: "src/content/menu/-index.md"
        format: "frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Meta Title", name: "meta_title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }

          - label: "Foods"
            name: "foods"
            widget: "list"
            summary: "{{fields.name}} — {{fields.currency}}{{fields.price}} ({{fields.group}})"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Currency"
                name: "currency"
                widget: "select"
                options:
                  - "$"
                  - "€"
                  - "£"
                default: "$"
              - { label: "Price", name: "price", widget: "string" }
              - label: "Group"
                name: "group"
                widget: "select"
                options:
                  - { label: "Breakfast", value: "Breakfast" }
                  - { label: "Starters & Salads", value: "Starters & Salads" } # keeps your existing value
                  - { label: "Soups & Panini", value: "Soups & Panini" }
                  - { label: "Sides", value: "Sides" }
                  - { label: "Bowls", value: "Bowls" }
                  - { label: "Main Dishes", value: "Main Dishes" }
                  - { label: "Pasta", value: "Pasta" }
                  - { label: "Neapolitan Style Pizza", value: "Neapolitan Style Pizza" }
                  - { label: "Drinks: Hot Coffee", value: "Drinks: Hot Coffee" }
                  - { label: "Drinks: Iced Coffee", value: "Drinks: Iced Coffee" }
                  - { label: "Drinks: Hot Tea", value: "Drinks: Hot Tea" }
                  - { label: "Drinks: Lemonades", value: "Drinks: Lemonades" }
                  - { label: "Drinks: Bottled", value: "Drinks: Bottled" }
                  - { label: "Drinks: Freshly Squeezed Juices", value: "Drinks: Freshly Squeezed Juices" }

          - label: "Food Apps"
            name: "food_apps"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }

  - name: "contact"
    label: "Contact Page"
    delete: false
    files:
      - name: "contact_index"
        label: "Contact Content"
        file: "src/content/contact/-index.md"
        format: "frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
          - label: "Open Hours"
            name: "open_hours"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
          - { label: "Enable Form", name: "form", widget: "boolean", default: true }

  - name: "gallery"
    label: "Gallery Page"
    delete: false
    files:
      - name: "gallery_index"
        label: "Gallery Content"
        file: "src/content/gallery/-index.md"
        format: "frontmatter"
        fields:
          - { label: "Title (supports **bold**)", name: "title", widget: "markdown" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.description}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Width (grid cols 1–12)", name: "width", widget: "number", value_type: "int", min: 1, max: 12, default: 4 }
  - name: "testimonial"
    label: "Testimonials Section"
    delete: false
    files:
      - name: "testimonial_section"
        label: "Customer Testimonials"
        file: "src/content/sections/testimonial.md"
        format: "frontmatter"
        fields:
          - { label: "Enable Section", name: "enable", widget: "boolean", default: true }
          - { label: "Title", name: "title", widget: "string" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.title}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title / Headline", name: "title", widget: "string" }
              - { label: "Address (City, State)", name: "address", widget: "string", required: false }
              - { label: "Avatar Image", name: "avatar", widget: "image" }
              - { label: "Content / Review Text", name: "content", widget: "text" }
