backend:
  name: git-gateway
  branch: master # Branch to update (optional; defaults to master)

media_folder: "public/images/uploads" # Location where files will be stored in the repo
public_folder: "/images/uploads" # The src attribute for uploaded media

collections:
  - name: "homepage"
    label: "Homepage"
    delete: false
    files:
      - name: "homepage_index"
        label: "Homepage Content"
        file: "src/content/homepage/-index.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                summary: "{{fields.label}} → {{fields.link}}"
                fields:
                  - { label: "Enable", name: "enable", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }

          - label: "Explore Menu"
            name: "explore_menu"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Icon (react-icons name)", name: "icon", widget: "string" }
                  - label: "Button"
                    name: "button"
                    widget: "object"
                    fields:
                      - { label: "Enable", name: "enable", widget: "boolean", default: true }
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Link", name: "link", widget: "string" }

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description (HTML/Markdown allowed)", name: "description", widget: "markdown" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Button"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Enable", name: "enable", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }

          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "markdown" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }

          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Content", name: "content", widget: "text" }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - label: "Key Benefits"
                name: "key_benefits"
                widget: "list"
                summary: "{{fields.benefit}}"
                fields:
                  - { label: "Benefit", name: "benefit", widget: "string" }
                  - { label: "Icon (react-icons name)", name: "icon", widget: "string" }

          - label: "Blog Section"
            name: "blog_section"
            widget: "object"
            fields:
              - { label: "Enable", name: "enable", widget: "boolean", default: false }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Button"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Enable", name: "enable", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
